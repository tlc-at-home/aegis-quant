[workspace]
resolver = "2"
members = [
    "crates/aegis-core",
    "crates/aegis-db",
    "crates/aegis-signals",
    "crates/aegis-risk",
    "crates/aegis-alerts",
    "crates/aegis-execution",
    "crates/aegis-backtest",
    "crates/aegis-web",
    "crates/aegis-cli",
]

[workspace.package]
version = "0.2.0-rc2"
edition = "2021"
authors = ["Aegis Quant Engineering"]
license = "Proprietary"
description = "Autonomous Self-Custodial Web3 DEX Quantitative Crypto Trading Platform (Hyperliquid L1)"

[workspace.dependencies]
aegis-core = { path = "crates/aegis-core" }
aegis-db = { path = "crates/aegis-db" }
aegis-signals = { path = "crates/aegis-signals" }
aegis-risk = { path = "crates/aegis-risk" }
aegis-alerts = { path = "crates/aegis-alerts" }
aegis-execution = { path = "crates/aegis-execution" }
aegis-backtest = { path = "crates/aegis-backtest" }
aegis-web = { path = "crates/aegis-web" }

anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
sha2 = "0.10"
sha3 = "0.10"
md-5 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
base64 = "0.22"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
rand = "0.8"
rayon = "1.10"
zeroize = { version = "1.8", features = ["derive"] }
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
